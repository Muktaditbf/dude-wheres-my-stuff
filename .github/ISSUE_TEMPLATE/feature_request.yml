name: 💡 Idea
description: Suggest a feature or an improvement
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      placeholder: I always forget where I parked at the mall…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
